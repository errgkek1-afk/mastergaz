<head>

<link rel="stylesheet" href="styles.css?v=11">
<script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>

<body>
<div id="root"></div>
<script type="text/babel" src="SmoothAccordion.jsx?v=11"></script>
<script type="text/babel" src="Messenger.jsx?v=11"></script>
<script type="text/babel" src="SubmitMorph.jsx?v=11"></script>

<script type="text/babel" src="Hero.jsx?v=11"></script>
<script type="text/babel" src="ErrorsVsUs.jsx?v=11"></script>
<script type="text/babel" src="Calculator.jsx?v=11"></script>
<script type="text/babel" src="Team.jsx?v=11"></script>

<script type="text/babel" src="Popup.jsx?v=11"></script>
<script type="text/babel">
function App(){
const [popup,setPopup]=React.useState(null);
const onCta=src=>setPopup(src);
return <div>
<Header onCta={onCta}/>
<Hero onCta={onCta}/>
<ErrorsVsUs/>
<Calculator onCta={onCta}/>
<RepairBrands onCta={onCta}/>
<CertificatesReviews/>
<Fleets/>
<Team/>
<FAQ/>
<Location/>
<BookingForm onCta={onCta}/>
<Footer/>
{popup&&<Popup source={popup} onClose={()=>setPopup(null)}/>}
</div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
