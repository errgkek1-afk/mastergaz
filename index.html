<head>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<link rel="stylesheet" href="landing.css?v=24">
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="SmoothAccordion.jsx?v=24"></script>
<script type="text/babel" src="Messenger.jsx?v=24"></script>
<script type="text/babel" src="SubmitMorph.jsx?v=24"></script>
<script type="text/babel" src="Header.jsx?v=24"></script>
<script type="text/babel" src="Hero.jsx?v=24"></script>
<script type="text/babel" src="ErrorsVsUs.jsx?v=24"></script>
<script type="text/babel" src="Calculator.jsx?v=24"></script>
<script type="text/babel" src="Team.jsx?v=24"></script>
<script type="text/babel" src="RepairBrands.jsx?v=24"></script>
<script type="text/babel" src="CertificatesReviews.jsx?v=24"></script>
<script type="text/babel" src="Fleets.jsx?v=24"></script>
<script type="text/babel" src="FAQ.jsx?v=24"></script>
<script type="text/babel" src="Location.jsx?v=24"></script>
<script type="text/babel" src="BookingForm.jsx?v=24"></script>
<script type="text/babel" src="Footer.jsx?v=24"></script>
<script type="text/babel" src="Popup.jsx?v=24"></script>
<script type="text/babel">
/* Разделитель между блоками: линия с двумя квадратиками из dvizhenie.js */
function Divider(){
return <div className="dv-row"><div data-divider=""><i></i><i></i></div></div>;
}
function App(){
const [popup,setPopup]=React.useState(null);
const onCta=src=>setPopup(src);
/* dvizhenie.js вешает наблюдатели один раз при запуске, а страницу рисует React -
   поэтому файл подключаем после отрисовки. Не ожил за 3 секунды - показываем всё без движения. */
React.useEffect(()=>{
  const pokazatVsyo=()=>document.documentElement.classList.remove('dv');
  const storozh=setTimeout(pokazatVsyo,3000);
  const s=document.createElement('script');
  s.src='dvizhenie.js?v=24';
  s.onload=()=>clearTimeout(storozh);
  s.onerror=()=>{clearTimeout(storozh);pokazatVsyo();};
  document.body.appendChild(s);
},[]);
return <div>
<Header onCta={onCta}/>
<Hero onCta={onCta}/>
<Divider/>
<ErrorsVsUs/>
<Calculator onCta={onCta}/>
<RepairBrands onCta={onCta}/>
<Divider/>
<Fleets/>
<Team/>
<Divider/>
<Location/>
<ReviewsBand/>
<BookingForm onCta={onCta}/>
<Divider/>
<FAQ/>
<Footer/>
{popup&&<Popup source={popup} onClose={()=>setPopup(null)}/>}
</div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
